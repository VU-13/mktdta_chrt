name: Weekly sector multiples update

on:
  schedule:
    - cron: '0 6 * * 3'   # every Wednesday, 06:00 UTC
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python fetch_multiples.py

      - name: Commit updated data
        run: |
          git config user.name "multiples-bot"
          git config user.email "actions@github.com"
          git add history.csv latest.json
          git diff --cached --quiet || git commit -m "Weekly multiples update"
          git push
